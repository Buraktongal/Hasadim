<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#1d4a33">
    <title>Harita — Hasadım</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/market-header.css"><link rel="stylesheet" href="/css/messages.css"><link rel="stylesheet" href="/css/ticaret.css">
    <link rel="stylesheet" href="/css/hesap-merkezi.css"><link rel="stylesheet" href="/css/tema-koyu.css">
    <script src="/js/i18n.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script src="/js/footer.js" defer></script>
    <script src="/js/fruit-icons.js" defer></script>
    <script src="/js/fruit-varieties.js" defer></script>
    <script src="/js/product-catalog.js" defer></script>
    <script src="/js/market-catalog.js" defer></script>
    <script src="/js/confirm-dialog.js" defer></script>
    <script src="/js/notification-bell.js" defer></script>
    <script src="/js/site-header.js" defer></script>
    <script src="/js/hasadim-api.js" defer></script>
    <script src="/js/mini-map.js" defer></script>
    <script src="/js/harita.js" defer></script>
    <script src="/js/navigation.js" defer></script>
</head>
<body data-page="map">
<div id="siteLayout"></div>
<main class="tool-page">
    <header class="tool-head">
        <div>
            <p class="eyebrow">Harita</p>
            <h1>Haritada ilanlar</h1>
            <p>Hangi ilde ne kadar ilan olduğunu gör; ürün veya araziyi haritada bul. İl kutusuna basınca o ilin ilanları açılır.</p>
        </div>
        <form id="mapFilters" class="tool-filters">
            <label>Kategori<select name="kategori"><option value="">Tüm kategoriler</option><option value="Meyve">Meyve</option><option value="Tahil">Tahıl</option><option value="Yem">Yem ve balya</option><option value="Bal">Bal ve arı ürünleri</option><option value="Kuruyemis">Kuruyemiş</option><option value="Arazi">Satılık / kiralık arazi</option></select></label>
            <label>Ürün<select name="meyveTuru" disabled><option value="">Önce kategori seç</option></select></label>
            <a id="mapListLink" class="secondary" href="/html/index.html">Liste olarak gör</a>
        </form>
    </header>
    <div class="segment-tabs" role="tablist" aria-label="Harita görünümü">
        <button type="button" role="tab" data-map-tab="il" aria-controls="cityPanel" aria-selected="true">İl haritası</button>
        <button type="button" role="tab" data-map-tab="sokak" aria-controls="streetPanel" aria-selected="false">Sokak haritası</button>
    </div>
    <p id="mapStatus" role="status" aria-live="polite"></p>
    <section id="cityPanel" role="tabpanel" class="map-panel city-panel">
        <div class="city-map-wrap">
            <div id="cityGrid" class="city-grid" aria-label="Türkiye il haritası"></div>
            <div class="city-legend" aria-hidden="true"><span>Az</span><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i><i class="level-5"></i><span>Çok ilan</span></div>
        </div>
        <aside class="city-side">
            <p id="mapTotal" class="map-total"></p>
            <h2>En çok ilan olan iller</h2>
            <ol id="topCities" class="top-cities"></ol>
        </aside>
    </section>
    <section id="streetPanel" role="tabpanel" class="map-panel" hidden>
        <div class="street-wrap">
            <div id="streetMap" class="mini-map street-map" aria-label="İlanların sokak haritası"></div>
            <div id="mapPopup" class="map-popup" role="dialog" aria-label="Seçilen ilan" hidden></div>
        </div>
        <p id="streetNote" class="muted"></p>
    </section>
</main>
<div id="siteFooter"></div>
</body>
</html>
