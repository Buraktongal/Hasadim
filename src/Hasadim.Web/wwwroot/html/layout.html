<div class="utility-bar">
    <div class="utility-inner">
        <span>Türkiye’nin toptan tarım ilan pazarı · Meyve, tahıl, yem, bal, kuruyemiş ve arazi</span>
        <span class="utility-note">İlan vermek ücretsiz · İlanlar 30 gün yayında</span>
    </div>
</div>
<header class="topbar market-header">
        <details id="accountMenu" class="account-dropdown">

            <summary class="account-menu-toggle" aria-label="Gezinme menüsü"><span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span><span class="menu-label">Menü</span><span class="message-count menu-message-count" data-message-count hidden></span></summary>

            <nav class="account-menu-panel"
                 aria-label="Hesap ve gezinme">
                <div class="menu-identity"><span class="account-menu-heading">Hoş geldin</span><strong id="accountMenuName">Hesabım</strong></div>

                <p class="account-menu-heading">
                    Keşfet
                </p>

                <button type="button"
                        class="navbtn selected"
                        data-view="all">
                    Pazar yeri
                </button>
                <a class="plain" href="/html/harita.html">Harita</a>
                <a class="plain" href="/html/urun-takvimi.html">Ürün takvimi</a>

                <hr data-auth-menu hidden>

                <p class="account-menu-heading"
                   data-auth-menu
                   hidden>
                    İlan işlemleri
                </p>

                <button type="button"
                        class="navbtn"
                        data-view="mine"
                        data-auth-menu
                        hidden>
                    İlanlarım
                </button>

                <button type="button" class="navbtn" data-view="history" data-auth-menu hidden>
                    Geçmiş ilanlar
                </button>

                <button type="button"
                        class="navbtn"
                        data-view="favorites"
                        data-auth-menu
                        hidden>
                    Favorilerim
                </button>

                <button type="button"
                        class="navbtn"
                        data-view="messages"
                        data-auth-menu
                        hidden>
                    Mesajlarım <span class="message-count" data-message-count hidden></span>
                </button>

                <a class="plain" href="/html/tekliflerim.html" data-auth-menu hidden>Tekliflerim <span class="message-count" data-offer-count hidden></span></a>
                <a class="plain" href="/html/kayitli-aramalar.html" data-auth-menu hidden>Kayıtlı aramalar</a>
                <a class="plain" href="/html/bildirimler.html" data-auth-menu hidden>Bildirimler <span class="message-count" data-notification-count hidden></span></a>

                <button type="button"
                        class="navbtn"
                        data-account-action="create-listing"
                        data-auth-menu
                        hidden>
                    Yeni ilan ver
                </button>

                <hr>

                <p class="account-menu-heading">
                    Hesap
                </p>

                <!-- app.js girişten sonra bu düğmeyi Profilim yapar -->
                <button id="accountBtn"
                        type="button"
                        class="plain">
                    Giriş yap
                </button>

                <a id="securityLink"
                   href="/html/hesabim.html"
                   class="plain"
                   hidden>
                    Hesap güvenliği
                </a>
                <a class="plain" href="/html/ayarlar.html">Ayarlar</a>

                <!-- Yalnızca yönetici hesabında gösterilir -->
                <button id="adminNav"
                        type="button"
                        class="navbtn"
                        data-view="admin"
                        hidden>
                    Yönetim paneli
                </button>

                <hr data-auth-menu hidden>

                <button id="logoutBtn"
                        type="button"
                        class="plain account-logout"
                        hidden>
                    Çıkış yap
                </button>

            </nav>
        </details>

    <!-- Logo -->
    <a class="site-logo"
       href="/"
       aria-label="Hasadım ana sayfa">
        <img src="/images/hasadim-logo.png"
             alt="Hasadım"
             width="2048"
             height="683">
    </a>

    <!-- Genel arama -->
    <form action="/"
          method="get"
          role="search"
          class="global-search">

        <label class="sr-only" for="globalQuery">
            Ürün veya ilan ara
        </label>

        <input id="globalQuery"
               name="q"
               type="search"
               placeholder="Ürün, çeşit veya ilan ara…"
               maxlength="150">

        <button type="submit" class="primary">
            Ara
        </button>
    </form>

    <!-- Bildirimler (giriş yapınca görünür) -->
    <a id="notificationBell" class="notification-bell" href="/html/bildirimler.html" aria-label="Bildirimler" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.6 2H4.4zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="bell-count" data-notification-count hidden></span>
    </a>

    <!-- Hızlı ilan oluşturma -->
    <button id="newBtn"
                type="button"
                class="primary header-new-listing">
            <span class="listing-plus" aria-hidden="true">+</span><span>İlan ver</span>
        </button>
</header>
<div id="messageAlert" class="message-alert" role="status" aria-live="polite" hidden><a href="/?view=messages"><strong id="messageAlertText"></strong><span>Mesajları aç →</span></a><button id="dismissMessageAlert" type="button" aria-label="Bildirimi kapat">×</button></div>
