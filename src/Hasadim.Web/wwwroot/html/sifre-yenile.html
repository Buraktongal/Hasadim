<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#1d4a33">
    <title>Yeni şifre belirle | Hasadım</title>
    <script src="/js/theme.js"></script>
    <script src="/js/yukleme.js"></script>
    <link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="stylesheet" href="/css/yukleme.css">
    <link rel="stylesheet" href="/css/auth-experience.css">
    <link rel="stylesheet" href="/css/tema-koyu.css">
    <script src="/js/return-path.js" defer></script>
    <script src="/js/auth-experience.js" defer></script>
    <script src="/js/account.js" defer></script>
    <script src="/js/i18n.js" defer></script>
</head>
<body data-page="reset" class="auth-body">
    <header class="auth-header">
        <a class="auth-logo" href="/" aria-label="Hasadım ana sayfa"><img src="/images/hasadim-logo.png" alt="Hasadım" width="150" height="50"></a>
        <a class="auth-back" href="/" data-return-link>← Ana sayfaya dön</a>
    </header>
    <div class="auth-shell auth-shell-single">
        <main class="auth-card">
            <p class="eyebrow">Şifre yenileme</p>
            <h1>Yeni şifre belirle</h1>
            <p class="auth-lead">Bağlantı bir saat geçerlidir. Şifren değişince açık oturumların kapanır.</p>
            <form id="resetForm">
                <label>Yeni şifre<input name="password" type="password" required maxlength="128" minlength="12" autocomplete="new-password"></label>
                <ul class="password-rules" aria-label="Şifre gereksinimleri"><li data-password-rule="length">En az 12 karakter</li><li data-password-rule="upper">Büyük harf</li><li data-password-rule="lower">Küçük harf</li><li data-password-rule="digit">Rakam</li></ul>
                <label>Yeni şifre tekrar<input name="passwordConfirm" type="password" required maxlength="128" minlength="12" autocomplete="new-password" data-match="password"></label>
                <small class="match-hint" data-match-hint="passwordConfirm" aria-live="polite"></small>
                <button class="primary full" type="submit">Şifreyi değiştir</button>
            </form>
            <p id="accountStatus" role="status" class="form-error"></p>
            <p class="auth-switch"><a href="/html/giris.html">Giriş sayfasına git</a></p>
        </main>
        
    </div>
</body>
</html>
