<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#1d4a33">
    <title>Şifreni yenile | Hasadım</title>
    <script src="/js/theme.js"></script>
    <script src="/js/yukleme.js"></script>
    <script src="/js/insan-dogrulama.js"></script>
    <link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="stylesheet" href="/css/yukleme.css">
    <link rel="stylesheet" href="/css/auth-experience.css">
    <link rel="stylesheet" href="/css/tema-koyu.css">
    <script src="/js/return-path.js" defer></script>
    <script src="/js/auth-experience.js" defer></script>
    <script src="/js/account.js" defer></script>
    <script src="/js/i18n.js" defer></script>
</head>
<body data-page="forgot" class="auth-body">
    <header class="auth-header">
        <a class="auth-logo" href="/" aria-label="Hasadım ana sayfa"><img src="/images/hasadim-logo.png" alt="Hasadım" width="150" height="50"></a>
        <a class="auth-back" href="/" data-return-link>← Ana sayfaya dön</a>
    </header>
    <div class="auth-shell auth-shell-single">
        <main class="auth-card">
            <p class="eyebrow">Şifre yardımı</p>
            <h1>Şifreni yenile</h1>
            <p class="auth-lead">Hesabına kayıtlı e-postayı yaz; şifre yenileme bağlantısı gönderelim.</p>
            <form id="forgotForm">
                <label>E-posta<input name="email" type="email" required maxlength="256" autocomplete="email"></label>
                <button class="primary full" type="submit">Bağlantı gönder</button>
            </form>
            <button id="resendConfirmation" class="textbtn full" type="button">Doğrulama e-postasını tekrar gönder</button>
            <p id="accountStatus" role="status" class="form-error"></p>
            <p class="auth-switch">Şifreni hatırladın mı? <a data-auth-link href="/html/giris.html">Giriş yap</a></p>
        </main>
        
    </div>
</body>
</html>
